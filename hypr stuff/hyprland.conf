$mainMod = SUPER
$terminal = foot
$fileManager = dolphin
$menu = fuzzel

env = XCURSOR_THEME,breeze_cursors
env = XCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

exec-once = waybar
exec-once = hyprctl setcursor breeze_cursors 24
exec-once = swww-daemon
exec-once = hypridle
exec-once = mako

monitor=,preferred,auto,1

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(e5d4a0ee)
    col.inactive_border = rgba(d8d5c033)
    layout = scrolling
}

scrolling {
    column_width = 0.5
    fullscreen_on_one_column = false
}

decoration {
    rounding = 0
    blur {
        enabled = true
        size = 3
        passes = 2
    }
}

animations {
    enabled = true

    bezier = smoothOut, 0.25, 0.46, 0.45, 0.94
    bezier = smoothIn, 0.55, 0.06, 0.68, 0.19
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = linear, 0, 0, 1, 1
    bezier = wsSwipe, 0.16, 1, 0.3, 1

    animation = windows, 1, 3, smoothOut, slide
    animation = windowsIn, 1, 1.5, smoothOut, popin 85%
    animation = windowsOut, 1, 1.5, smoothIn, popin 85%
    animation = windowsMove, 1, 4, smoothOut

    animation = fade, 1, 4, smoothOut
    animation = fadeIn, 1, 3, smoothOut
    animation = fadeOut, 1, 3, smoothIn

    animation = border, 1, 6, smoothOut
    animation = borderangle, 1, 20, linear, loop

    animation = workspaces, 1, 4, wsSwipe, slidevert
    animation = specialWorkspace, 1, 3, smoothOut, slidevert
}

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, W, exec, wlogout
bind = $mainMod SHIFT, W, exec, waypaper
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, L, exec, hyprlock

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5


bind = $mainMod, right, layoutmsg, focus r
bind = $mainMod, left, layoutmsg, focus l
bind = $mainMod SHIFT, right, movetoworkspace, +1
bind = $mainMod SHIFT, left, movetoworkspace, -1


bind = $mainMod, period, layoutmsg, move +col
bind = $mainMod, comma, layoutmsg, move -col
bind = $mainMod, H, layoutmsg, focus l
bind = $mainMod, semicolon, layoutmsg, focus r
bind = $mainMod, K, layoutmsg, focus u
bind = $mainMod, J, layoutmsg, focus d

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = , Print, exec, grimblast copy area
bind = SUPER SHIFT, T, exec, grimblast copysave area

windowrule = match:class ^(Rofi)$, animation popin 90%
windowrule = match:class ^(thunar)$, float on

layerrule = match:namespace ^(waybar)$, blur 1
layerrule = match:namespace ^(waybar)$, ignore_alpha 0.5
